<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DGL Marketing Execution OS</title>
<meta name="description" content="Plataforma interna de ejecución de Marketing para Dedicated Ground Logistics (DGL). Conversión, retención, reactivación y crecimiento de cartera." />

<script>
(function () {
  "use strict";
  var ready = false;
  var pending = [];
  function flush() {
    var box = document.getElementById("bootError");
    var btn = document.getElementById("bootReload");
    if (!box || !pending.length) return;
    box.style.display = "block";
    box.textContent = pending.join("\n");
    if (btn) btn.style.display = "inline-block";
  }
  function report(msg) {
    if (pending.indexOf(msg) === -1) pending.push(msg);
    flush();
  }
  window.__dglMarkReady = function () { ready = true; pending = []; flush(); };
  window.__dglBootFail = report;
  window.addEventListener("error", function (e) {
    if (e && e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href || "recurso desconocido";
      report("No se pudo cargar: " + url);
    } else if (e && e.message && !ready) {
      var loc = e.filename ? " (" + e.filename.split("/").pop() + (e.lineno ? ":" + e.lineno : "") + ")" : "";
      report("Error de JavaScript: " + e.message + loc);
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    if (!ready) report("Promesa no controlada: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  document.addEventListener("DOMContentLoaded", flush);
  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "bootReload") window.location.reload();
  });
  setTimeout(function () {
    if (!ready) report("La plataforma tarda más de lo esperado en iniciar. Revisa la consola del navegador (F12 → Console) para ver el detalle.");
  }, 8000);
})();
</script>

<body>

<div id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;color:#6B7280;font-family:Inter,-apple-system,sans-serif;font-size:13px;text-align:center;padding:24px;background:#060816">
    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#77B82A,#5a9420);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06210a;font-size:15px">DG</div>
    <div>Cargando DGL Marketing Execution OS…</div>
    <div id="bootError" style="display:none;max-width:520px;color:#ff9c9c;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.6;text-align:left;white-space:pre-line"></div>
    <button id="bootReload" style="display:none;padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#fff;font-size:12px;cursor:pointer;font-family:inherit">Reintentar</button>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script>
(function (global) {
  "use strict";

  const ENDPOINT = "https://script.google.com/macros/s/AKfycbz48XbgUkg4cNexwhzvXvN9lJsr9D0s4DUz5zzyO5wmIh1z5BRZHZVABO1EiBC_wcG0/exec";
  const KEY_NAME = "dgl_gas_api_key_session";
  const D = () => global.DGL_DATA || {};
  let live = false;
  let syncing = false;

  function key() {
    return sessionStorage.getItem(KEY_NAME) || "";
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function plusDays(days) {
    const date = new Date();
    date.setDate(date.getDate() + Number(days || 0));
    return date.toISOString().slice(0, 10);
  }

  function uid(prefix) {
    return prefix + "-" + Date.now().toString(36).toUpperCase() +
      Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  function parseList(value) {
    if (Array.isArray(value)) return value;
    if (!value) return [];
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : [parsed];
    } catch (_) {
      return String(value).split(",").map((item) => item.trim()).filter(Boolean);
    }
  }

  function toast(message, type) {
    if (global.DGL_INTERACTIONS && global.DGL_INTERACTIONS.toast) {
      global.DGL_INTERACTIONS.toast(message, type);
    }
  }

  function jsonp(action, payload, needsKey) {
    return new Promise((resolve, reject) => {
      const apiKey = key();
      if (needsKey !== false && !apiKey) {
        reject(new Error("API_KEY_REQUIRED"));
        return;
      }

      const callbackName = "__dglGasCb" + Date.now() + Math.random().toString(36).slice(2);
      const parameters = new URLSearchParams({ action, callback: callbackName });
      if (needsKey !== false) parameters.set("apiKey", apiKey);

      Object.keys(payload || {}).forEach((name) => {
        const value = payload[name];
        if (value === undefined || value === null) return;
        parameters.set(name, typeof value === "object" ? JSON.stringify(value) : String(value));
      });

      const script = document.createElement("script");
      let completed = false;
      const timer = setTimeout(() => finish(new Error("Tiempo de conexión agotado")), 20000);

      function finish(error, result) {
        if (completed) return;
        completed = true;
        clearTimeout(timer);
        try { delete global[callbackName]; } catch (_) { global[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (error) reject(error);
        else resolve(result);
      }

      global[callbackName] = (response) => {
        if (response && response.ok) finish(null, response.result);
        else finish(new Error(response && response.error ? response.error : "Error de Apps Script"));
      };

      script.onerror = () => finish(new Error("No se pudo acceder a Apps Script"));
      script.src = ENDPOINT + "?" + parameters.toString();
      document.head.appendChild(script);
    });
  }

  async function ensureKey() {
    if (key()) return true;
    const entered = global.prompt(
      "Pega la DGL_API_KEY. Se guardará solo durante esta pestaña y no se publicará en GitHub."
    );
    if (!entered || !entered.trim()) return false;
    sessionStorage.setItem(KEY_NAME, entered.trim());
    return true;
  }

  function injectStatus() {
    if (document.getElementById("dglGasStatus")) return;

    const style = document.createElement("style");
    style.id = "dglGasStatusStyles";
    style.textContent =
      ".dgl-gas-status{position:fixed;right:18px;bottom:18px;z-index:2147483646;" +
      "border:1px solid rgba(255,255,255,.16);background:#0d1122;color:#cbd5e1;" +
      "border-radius:12px;padding:10px 13px;font:600 11px Inter,Arial,sans-serif;" +
      "box-shadow:0 12px 35px rgba(0,0,0,.45);cursor:pointer}" +
      ".dgl-gas-status.online{color:#9fe870;border-color:rgba(119,184,42,.55)}" +
      ".dgl-gas-status.error{color:#ff9c9c;border-color:rgba(239,68,68,.55)}" +
      ".dgl-gas-status.sync{color:#f8d477;border-color:rgba(245,158,11,.55)}";
    document.head.appendChild(style);

    const button = document.createElement("button");
    button.id = "dglGasStatus";
    button.type = "button";
    button.className = "dgl-gas-status";
    button.textContent = "Conectar Apps Script";
    button.addEventListener("click", () => syncAll(true));
    document.body.appendChild(button);
  }

  function setStatus(className, text) {
    injectStatus();
    const element = document.getElementById("dglGasStatus");
    if (!element) return;
    element.className = "dgl-gas-status" + (className ? " " + className : "");
    element.textContent = text;
  }

  function replaceArray(name, values) {
    if (!Array.isArray(values)) values = [];
    const data = D();
    if (Array.isArray(data[name])) {
      data[name].splice(0, data[name].length, ...values);
    } else {
      data[name] = values;
    }
  }

  function mapCampaign(campaign) {
    return Object.assign({}, campaign, {
      cta: campaign.cta || "Ver Campaña",
      approvalStatus: campaign.approvalStatus || "Pendiente",
      dueDate: campaign.dueDate || campaign.endDate || "",
      emailsSent: Number(campaign.emailsSent || campaign.sent || 0),
      responsesLogged: Number(campaign.responsesLogged || campaign.replies || 0),
      audienceCount: Number(campaign.audienceCount || 0),
      taskCount: Number(campaign.taskCount || 0)
    });
  }

  function mapSequenceRows(rows) {
    const groups = {};
    (rows || []).forEach((row) => {
      const groupKey = row.name || row.id;
      if (!groups[groupKey]) {
        groups[groupKey] = {
          id: row.id,
          name: row.name,
          trigger: row.trigger,
          segment: row.segment,
          status: row.status,
          metrics: { sent: 0, openRate: 0, replyRate: 0 },
          emails: []
        };
      }
      groups[groupKey].emails.push({
        step: Number(row.step || 1),
        timing: Number(row.delayHours || 0) ? "+" + row.delayHours + "h" : "Inmediato",
        subject: row.subject || "Sin asunto",
        preheader: row.preheader || ""
      });
    });
    return Object.values(groups);
  }

  function markLive() {
    if (!live) return;
    let changed = false;

    document.querySelectorAll(".sample-flag").forEach((element) => {
      if (element.dataset.dglLive === "true") return;
      element.dataset.dglLive = "true";
      element.textContent = "DATOS EN VIVO";
      element.style.color = "#9fe870";
      element.style.borderColor = "rgba(119,184,42,.45)";
      changed = true;
    });

    if (changed && global.lucide && typeof global.lucide.createIcons === "function") {
      global.lucide.createIcons();
    }
  }

  function rerender() {
    const moduleId = location.hash.replace("#/", "").trim() || "command-center";
    const mount = document.getElementById("mainContent");
    if (mount && global.DGL_MODULE_RENDERERS && global.DGL_MODULE_RENDERERS[moduleId]) {
      global.DGL_MODULE_RENDERERS[moduleId](mount, true);
    }
    setTimeout(markLive, 30);
  }

  function updateAnalytics(dashboard) {
    const data = D();
    if (!data.analytics || !dashboard) return;
    Object.assign(data.analytics, {
      activeCampaigns: Number(dashboard.activeCampaigns || 0),
      emailsSent: Number(dashboard.sentEmails || 0),
      revenueInfluenced: Number(dashboard.attributedRevenue || 0),
      accountsReactivated: (data.customers || []).filter((customer) =>
        String(customer.status || "").toLowerCase().includes("reactiv")
      ).length,
      quotesRecovered: (data.quotedNotBooked || []).filter((quote) =>
        ["Recovered", "Won", "Booked"].includes(quote.status)
      ).length
    });
  }

  async function list(module, filters) {
    return jsonp("list", { module, filters: filters || {} }, true);
  }

  async function get(module, id) {
    return jsonp("get", { module, id }, true);
  }

  async function upsert(module, record) {
    return jsonp("upsert", Object.assign({ module }, record), true);
  }

  function applySupplementary(results) {
    const [customers, quotes, sequences, playbooks, assets, approvals, tasks, dashboard, abm, retention, growth, seo] = results;

    if (customers.status === "fulfilled") {
      replaceArray("customers", (customers.value || []).map((customer) =>
        Object.assign({}, customer, { servicesUsed: parseList(customer.servicesUsed) })
      ));
    }
    if (quotes.status === "fulfilled") replaceArray("quotedNotBooked", quotes.value || []);
    if (sequences.status === "fulfilled") replaceArray("emailSequences", mapSequenceRows(sequences.value || []));
    if (playbooks.status === "fulfilled") replaceArray("playbooks", playbooks.value || []);
    if (assets.status === "fulfilled") replaceArray("assets", assets.value || []);
    if (approvals.status === "fulfilled") replaceArray("governance", approvals.value || []);
    if (tasks.status === "fulfilled") {
      const pending = (tasks.value || []).filter((task) => String(task.status) === "Pending");
      replaceArray("mondayActionPlan", pending.slice(0, 12).map((task) => ({
        priority: task.priority || "Media",
        action: task.title,
        owner: task.owner,
        module: task.sourceType || "Campaign Tasks"
      })));
    }
    if (dashboard.status === "fulfilled") updateAnalytics(dashboard.value || {});
    if (abm.status === "fulfilled") replaceArray("abmAccounts", abm.value || []);
    if (retention.status === "fulfilled") replaceArray("retentionCampaigns", retention.value || []);
    if (growth.status === "fulfilled") replaceArray("growthOpportunities", growth.value || []);
    if (seo.status === "fulfilled" && D().seoGeo && (seo.value || []).length) {
      D().seoGeo.strategicKeywords = seo.value;
    }
  }

  async function syncAll(promptForKey) {
    if (syncing) return false;
    if (!key()) {
      if (!promptForKey || !(await ensureKey())) return false;
    }

    syncing = true;
    setStatus("sync", "Conectando con Apps Script…");

    try {
      const campaigns = await list("campaigns");
      replaceArray("campaigns", (campaigns || []).map(mapCampaign));

      const data = D();
      data.meta = data.meta || {};
      data.meta.liveSync = true;
      data.meta.lastSync = new Date().toISOString();
      live = true;

      setStatus("online", "Apps Script conectado");
      rerender();

      Promise.allSettled([
        list("customers"),
        list("quotes"),
        list("emailSequences"),
        list("playbooks"),
        list("assets"),
        list("approvals"),
        list("campaignTasks"),
        jsonp("dashboard", {}, true),
        list("abm"),
        list("retention"),
        list("growth"),
        list("seoGeo")
      ]).then((results) => {
        applySupplementary(results);
        rerender();
      });

      return true;
    } catch (error) {
      if (/Unauthorized/i.test(error.message)) sessionStorage.removeItem(KEY_NAME);
      setStatus("error", "Error: " + error.message);
      toast(error.message, "error");
      console.error("DGL Apps Script sync failed:", error);
      return false;
    } finally {
      syncing = false;
    }
  }

  async function refreshCampaignsFromAPI() {
    if (!key()) return false;
    const rows = await list("campaigns");
    replaceArray("campaigns", (rows || []).map(mapCampaign));
    live = true;
    rerender();
    return true;
  }

  function ruleForType(type) {
    if (type === "Recuperación de Cotizaciones" || type === "Post-Cotización") return "quoted-not-booked";
    if (type === "Reactivación" || type === "Recuperación de Cuentas") return "reactivation-60";
    if (type === "Retención") return "retention-risk";
    if (type === "Cross Selling" || type === "Upselling") return "mono-service-growth";
    return "";
  }

  async function createCampaign(payload) {
    if (!(await ensureKey())) return { ok: false, error: "Conexión cancelada" };
    const saved = await upsert("campaigns", Object.assign({
      id: payload.id || uid("CMP"),
      status: "Draft",
      objective: payload.objective || ((payload.type || "Campaña") + " para " + (payload.segment || "cartera objetivo")),
      approver: "Dirección Comercial",
      startDate: today(),
      endDate: plusDays(30),
      nextAction: "Generar audiencia y solicitar aprobación",
      priority: "Alta",
      automationRule: ruleForType(payload.type),
      sent: 0,
      replies: 0,
      quotes: 0,
      loads: 0,
      revenue: 0
    }, payload));
    return { ok: true, campaign: mapCampaign(saved) };
  }

  async function updateCampaign(id, fields) {
    if (!(await ensureKey())) return { ok: false, error: "Conexión cancelada" };
    const saved = await upsert("campaigns", Object.assign({ id }, fields));
    return { ok: true, campaign: mapCampaign(saved) };
  }

  async function generateAudience(id) {
    if (!(await ensureKey())) return { ok: false, error: "Conexión cancelada" };
    await jsonp("runAutomation", {}, true);
    const after = await list("campaignTasks", { campaignId: id });
    await upsert("campaigns", { id, audienceCount: after.length, taskCount: after.length });
    return { ok: true, audienceTotal: after.length };
  }

  async function sendCampaignEmails(id) {
    if (!(await ensureKey())) return { ok: false, error: "Conexión cancelada" };
    const queued = await jsonp("enqueueCampaign", { campaignId: id }, true);
    const processed = await jsonp("processEmailQueue", {}, true);
    return {
      ok: true,
      draftsCreated: Number(processed.drafted || 0),
      emailsSentTotal: Number(processed.sent || 0),
      queued: Number(queued.queued || 0)
    };
  }

  async function logResponse(id) {
    if (!(await ensureKey())) return { ok: false, error: "Conexión cancelada" };
    const campaign = await get("campaigns", id);
    const replies = Number(campaign.replies || 0) + 1;
    await upsert("campaigns", { id, replies });
    return { ok: true, responsesLogged: replies };
  }

  global.DGL_API = {
    API_BASE: ENDPOINT,
    connect: () => syncAll(true),
    syncAll,
    refreshCampaignsFromAPI,
    createCampaign,
    updateCampaign,
    generateAudience,
    sendCampaignEmails,
    logResponse,
    list,
    get,
    upsert,
    runAutomation: () => jsonp("runAutomation", {}, true),
    processEmailQueue: () => jsonp("processEmailQueue", {}, true),
    disconnect: () => {
      sessionStorage.removeItem(KEY_NAME);
      live = false;
      setStatus("", "Backend online · conectar");
    }
  };

  function initialize() {
    injectStatus();
    jsonp("health", {}, false)
      .then(() => {
        setStatus(key() ? "sync" : "", key() ? "Sincronizando…" : "Backend online · conectar");
        if (key()) syncAll(false);
      })
      .catch(() => setStatus("error", "Backend no disponible"));

    const observer = new MutationObserver(() => {
      if (live) markLive();
      if (!document.getElementById("dglGasStatus")) injectStatus();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize, { once: true });
  } else {
    initialize();
  }
})(window);

</script>
