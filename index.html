<!-- ============================================================
     BOOT DIAGNOSTICS — must be the first script in the document.
     Registers error/timeout handlers BEFORE any other resource is
     requested, so a failed CDN or a missing project file never
     leaves the user staring at an infinite "Cargando..." screen.
     Works identically on file://, localhost or a GitHub Pages
     subpath (https://<user>.github.io/<repo>/) since it never
     assumes a root path.
     ============================================================ -->
<script>
(function () {
  "use strict";
  var ready = false;
  var pending = [];

  function flush() {
    var box = document.getElementById("bootError");
    var btn = document.getElementById("bootReload");
    if (!box || !pending.length) return;
    box.style.display = "block";
    box.textContent = pending.join("\n");
    if (btn) btn.style.display = "inline-block";
  }
  function report(msg) {
    if (pending.indexOf(msg) === -1) pending.push(msg);
    flush();
  }

  window.__dglMarkReady = function () { ready = true; pending = []; flush(); };
  window.__dglBootFail = report;

  // Catches 404s / blocked CDNs for <script>/<link> tags (capture phase —
  // resource errors do not bubble, so this must run in the capture phase).
  window.addEventListener("error", function (e) {
    if (e && e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href || "recurso desconocido";
      report("No se pudo cargar: " + url);
    } else if (e && e.message && !ready) {
      var loc = e.filename ? " (" + e.filename.split("/").pop() + (e.lineno ? ":" + e.lineno : "") + ")" : "";
      report("Error de JavaScript: " + e.message + loc);
    }
  }, true);

  window.addEventListener("unhandledrejection", function (e) {
    if (!ready) report("Promesa no controlada: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  document.addEventListener("DOMContentLoaded", flush);
  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "bootReload") window.location.reload();
  });

  // Watchdog: if the app hasn't signaled readiness after 8s, stop
  // spinning forever and tell the user something is actually wrong.
  setTimeout(function () {
    if (!ready) {
      report("La plataforma tarda más de lo esperado en iniciar. Revisa la consola del navegador (F12 → Console) para ver el detalle, confirma tu conexión a internet (se cargan Chart.js y Lucide Icons desde CDN) y verifica que las carpetas assets/ y components/ se hayan publicado junto a index.html.");
    }
  }, 8000);
})();
</script>

  </div>
</div>
