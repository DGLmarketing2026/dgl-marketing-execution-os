<script>
(function () {
  "use strict";
  var ready = false;
  var pending = [];
  function flush() {
    var box = document.getElementById("bootError");
    var btn = document.getElementById("bootReload");
    if (!box || !pending.length) return;
    box.style.display = "block";
    box.textContent = pending.join("\n");
    if (btn) btn.style.display = "inline-block";
  }
  function report(msg) {
    if (pending.indexOf(msg) === -1) pending.push(msg);
    flush();
  }
  window.__dglMarkReady = function () { ready = true; pending = []; flush(); };
  window.__dglBootFail = report;
  window.addEventListener("error", function (e) {
    if (e && e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href || "recurso desconocido";
      report("No se pudo cargar: " + url);
    } else if (e && e.message && !ready) {
      var loc = e.filename ? " (" + e.filename.split("/").pop() + (e.lineno ? ":" + e.lineno : "") + ")" : "";
      report("Error de JavaScript: " + e.message + loc);
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    if (!ready) report("Promesa no controlada: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  document.addEventListener("DOMContentLoaded", flush);
  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "bootReload") window.location.reload();
  });
  setTimeout(function () {
    if (!ready) report("La plataforma tarda más de lo esperado en iniciar. Revisa la consola del navegador (F12 → Console) para ver el detalle.");
  }, 8000);
})();
</script>
